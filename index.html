<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小众测试</title><meta name="color-scheme" content="dark">
<style>
*{box-sizing:border-box}
:root{--or:#ff9000;--or2:#ffa31a;--bg:#000;--p1:#0e0e0e;--p2:#161616;--ln:#262626;--tx:#f4f1ec;--mu:#8c8780;--cream:#ece4d6;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 "PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:880px;margin:0 auto;padding:22px 16px 40px}
.logo{display:inline-flex;align-items:center;gap:2px;font-weight:900;letter-spacing:-.03em;line-height:1;color:#fff;font-size:30px}
.logo b{background:var(--or);color:#000;border-radius:.2em;padding:.12em .24em .16em;font-weight:900}
.logo.xl{font-size:clamp(54px,13vw,96px);margin:0 0 26px}
header{display:flex;justify-content:space-between;align-items:center;padding:4px 0 26px;border-bottom:1px solid var(--ln);margin-bottom:26px}
header span{color:var(--mu);font-size:13px}
.panel{background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:clamp(22px,5vw,44px)}
h1{margin:0 0 6px;font-size:clamp(28px,5vw,40px);font-weight:900;letter-spacing:-.03em;line-height:1.2}
h2{font-size:clamp(22px,4.2vw,30px);line-height:1.45;font-weight:800;margin:0;letter-spacing:-.01em}
p{margin:0 0 14px}
.lead{font-size:clamp(17px,2.6vw,20px);color:var(--cream);max-width:34em}
.mu{color:var(--mu);font-size:14px}
.warn{color:var(--tx);font-size:15px;border-left:2px solid var(--or);padding-left:12px;max-width:42em;margin:22px 0 14px}
.hidden{display:none!important}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:10px;padding:12px 20px;border:1px solid #333;background:transparent;color:var(--tx);transition:background .15s,border-color .15s,color .15s}
button:hover:not(:disabled){border-color:var(--or)}
button:focus-visible{outline:2px solid var(--or);outline-offset:3px}
button:disabled{cursor:not-allowed;background:#141414;border-color:#1f1f1f;color:#4a4a4a}
.primary{background:var(--or);border-color:var(--or);color:#000}
.primary:hover:not(:disabled){background:var(--or2);border-color:var(--or2)}
.primary:disabled{background:#141414;border-color:#1f1f1f;color:#4a4a4a}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:14px}
.top b{color:var(--tx)}
.progress{height:4px;background:#1f1f1f;border-radius:4px;margin:12px 0 34px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--or);border-radius:4px;transition:width .25s}
.options{display:grid;gap:10px;margin:30px 0 8px}
.option{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:16px 18px;background:var(--p2);border-color:#2a2a2a;font-weight:600}
.option i{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #4a4a4a}
.option.selected{background:var(--or);border-color:var(--or);color:#000}
.option.selected i{border-color:#000;background:radial-gradient(#000 0 45%,transparent 50%)}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:28px}
.actions div{display:flex;gap:8px}
.score-l{color:var(--mu);font-size:14px;margin-top:14px}
.score{font-size:clamp(84px,20vw,140px);font-weight:900;line-height:1;letter-spacing:-.05em;color:var(--or)}
.sec{border-top:1px solid var(--ln);margin-top:34px;padding-top:26px}
.sec h2{margin-bottom:20px}
.dims{display:grid;gap:22px}
.dim{display:grid;grid-template-columns:minmax(0,170px) 1fr minmax(0,170px);gap:16px;align-items:center}
.end{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px;font-weight:800}
.end em{font-style:normal;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.end.l em{color:var(--or)}.end.r em{color:var(--cream)}
.track{height:12px;background:var(--cream);border-radius:12px;overflow:hidden}
.track i{display:block;height:100%;background:var(--or);border-radius:12px 0 0 12px}
.tags{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.tag{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:16px 18px}
.tag h3{margin:0 0 6px;font-size:18px;font-weight:900;color:var(--or)}
.tag p{margin:0 0 10px;font-size:14px;color:var(--cream);line-height:1.6}
.tag small{color:var(--mu);font-size:12px}
footer{text-align:center;color:#5a5650;font-size:12px;padding:26px}
@media(max-width:600px){.dim{grid-template-columns:1fr 1fr;gap:10px 16px}.dim .track{grid-column:1/-1;grid-row:2}.logo{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main>
<header id="hd" class="hidden"><div class="logo">小众<b>测试</b></div><span>娱乐测试 · Beta 02</span></header>

<section id="home" class="panel" style="margin-top:clamp(0px,4vh,32px)">
<div class="logo xl">小众<b>测试</b></div>
<p class="lead">通过六个维度，生成你的小众指数与倾向词条。</p>
<p class="warn">本测试仅适用于中国大陆语境，仅供娱乐。题目带有明显主观性，缺乏严格的心理测量学验证，结果并不严谨，部分题目或词条可能造成冒犯。</p>
<p class="mu">共 <span id="total"></span> 题，每题选一项，可返回修改。</p>
<button id="start" class="primary">开始测试</button>
</section>

<section id="test" class="panel hidden">
<div class="top"><span><b id="cur"></b> / <span id="tot"></span></span><span id="answered"></span></div>
<div class="progress"><span id="bar"></span></div>
<h2 id="question"></h2>
<div id="options" class="options"></div>
<div class="actions"><button id="prev">上一题</button><div><button id="restart">重来</button><button id="next" class="primary" disabled>下一题</button></div></div>
</section>

<section id="result" class="panel hidden">
<h1>测试结果</h1>
<div class="score-l">小众指数</div>
<div class="score" id="score">0</div>
<div class="sec"><h2>六维正反对照</h2><div id="dims" class="dims"></div></div>
<div class="sec"><h2>触发词条 <span id="tagcount" class="mu"></span></h2><div id="tags" class="tags"></div><p id="notags" class="mu hidden">这次没有触发词条。</p></div>
<div class="actions"><button id="edit">检查答案</button><button id="again" class="primary">重新测试</button></div>
</section>
<footer>本地运行 · 答案不会上传</footer>
</main>
<script>
const dims=[["W","世界观偏离","主流认同",10],["I","感知敏锐","感知宽容",7],["M","边缘敏感","主流适应",8],["F","反常识倾向","循规顺从",10],["C","文化离群","文化主流",12],["S","自我反身性","盲目投射",11]];
const tags={
"内陆帝国":"让无生命之物开口，直觉凌驾理性，真假难辨，因此既危险又深邃",
"宏大叙事":"以总体性框架解释世界、赋予意义的统一故事",
"天人感应":"察觉他人未言之意与城市的集体情绪",
"叙事怀疑":"利奥塔称后现代即对宏大叙事的怀疑",
"审美自主":"审美源于主体的自由自律，判断不受欲望与概念强制",
"体验至上":"将直接感受视为价值核心的立场，认为意义源于亲身经历的当下体验",
"斗笠":"请调整斗笠","自由主义":"向往，渴望，渴求，痴迷","怀旧":"回不去了，你有班有学要上",
"人间失格":"生きるってのはな、痛いんだよ","虚无主义":"一切归于混沌",
"概念化":"强大的艺术鉴赏与联想力，善于解读与将现实事物抽象化",
"平心定气":"过人的意志力与心理韧性","亚文化":"行"};
const Q=[
["Wo1","没有取得传统意义上的成功，也可能拥有很好的人生。",[{d:{W:2},t:{"自由主义":.5}},{d:{W:1}},{d:{W:0},t:{"宏大叙事":.5}}]],
["Wo2","关系的价值看的是它带来了什么，而不是持续了多久。",[{d:{W:2,S:1},t:{"体验至上":1}},{d:{W:1}},{d:{W:0}}]],
["Wo3","如果一种社会规则让大多数人过得更方便，却明显限制了少数人的选择，我会仅仅因为它对多数人有效就认为它合理。",[{d:{W:-1},t:{"宏大叙事":.5}},{d:{W:0}},{d:{W:2},t:{"自由主义":.5}}]],
["Wo4","祖宗之法，不可变",[{d:{W:0},t:{"宏大叙事":1,"斗笠":1}},{d:{W:0}},{d:{W:1}}]],
["Wo5","一个人后来成为了自己曾经最不理解的那种人，往往说明他偏离了最初的自己。",[{d:{W:0,S:0}},{d:{W:0,S:0}},{d:{W:1,S:1}}]],
["Wo6","如果一个人明知道某种选择不会带来更多东西，却仍然长期坚持，这往往说明这个选择的价值有限，值得重新考虑。",[{d:{W:0},t:{"虚无主义":.5}},{d:{W:1}},{d:{W:2},t:{"体验至上":1}}]],
["Io1","我不会在说不清理由时给一个人下判断，往往等理由清楚了才形成看法。",[{d:{I:1}},{d:{I:1}},{d:{I:2},t:{"内陆帝国":.5,"天人感应":.25}}]],
["Io2","当一件事在各种解释下都说得通时，我通常会先相信自己最初形成的那种感觉。",[{d:{I:2},t:{"内陆帝国":.5,"天人感应":.25}},{d:{I:1}},{d:{I:0}}]],
["Io3","在欣赏作品（如电影、艺术、设计）时，你更容易被具有象征意味的氛围和隐喻打动，而不是被严丝合缝的写实细节打动。",[{d:{I:2},t:{"内陆帝国":.5,"天人感应":.25,"概念化":1}},{d:{I:1}},{d:{I:0}}]],
["Io4","贴标签很爽对吧",[{d:{I:1},t:{"内陆帝国":.5,"天人感应":.25}},{d:{I:1},t:{"内陆帝国":.5,"天人感应":.25}},{d:{I:1}}]],
["Mo1","有时候，真正值得注意的并不是某件事情发生了，而是为什么很少有人注意到它。",[{d:{M:2}},{d:{M:1}},{d:{M:0}}]],
["Fo1","如果某种行为在大多数情况下都能奏效，那么人们把它当成普遍经验并没有什么问题。",[{d:{F:0}},{d:{F:1}},{d:{F:2,W:1},t:{"叙事怀疑":1}}]],
["Fo2","当事物的解释越顺滑，越可能是“好用的故事”。",[{d:{F:2},t:{"叙事怀疑":1,"虚无主义":.5}},{d:{F:1}},{d:{F:0}}]],
["Fo3","人们对一件事的判断，往往受到它最初被介绍的方式影响。",[{d:{F:2},t:{"叙事怀疑":1}},{d:{F:1}},{d:{F:0}}]],
["Fo4","事情本就如此，恰恰是最诚实的解释。",[{d:{F:0}},{d:{F:1}},{d:{F:2},t:{"叙事怀疑":1}}]],
["Fo5","复杂和新颖的想法比简单直接的想法更能激发你的兴趣。",[{d:{F:2}},{d:{F:1}},{d:{F:0}}]],
["Co1","我喜欢一样东西时，通常不太在意它有没有很多人喜欢 :)",[{d:{C:2},t:{"审美自主":.5}},{d:{C:1}},{d:{C:0}}]],
["Co2","自己喜欢的东西很难用身边人的共同话题解释。",[{d:{C:2,M:2},t:{"亚文化":.5}},{d:{C:1,M:1}},{d:{C:0}}]],
["Co3","小众的众还有三个人，而我却孤身一人",[{d:{C:2,M:2},t:{"人间失格":1,"亚文化":.5}},{d:{C:1,M:1}},{d:{C:0}}]],
["Co4","过时的事物将失去价值",[{d:{C:0}},{d:{C:1}},{d:{C:2},t:{"怀旧":1}}]],
["Co5","我对“这东西属于什么圈子”这件事本身没有太大兴趣。",[{d:{C:2,S:1},t:{"审美自主":1}},{d:{C:1},t:{"审美自主":.5}},{d:{C:1},t:{"亚文化":.5}}]],
["Co6","一件东西有没有形成稳定的受众群体，对我判断它是否值得喜欢影响不大。",[{d:{C:2,M:2},t:{"审美自主":1}},{d:{C:1,M:1},t:{"审美自主":.5}},{d:{C:1},t:{"亚文化":.5}}]],
["So1","我曾经认真怀疑过一些自己一直以来都认为理所当然的想法。",[{d:{S:2},t:{"叙事怀疑":1}},{d:{S:1}},{d:{S:0}}]],
["So2","我会区分“我真正这么想”和“我希望自己是这样想的”。",[{d:{S:2},t:{"平心定气":1}},{d:{S:1}},{d:{S:0}}]],
["So3","当别人指出我的某个问题时，我首先想到的有时不是他说得对不对，而是为什么这句话会让我不舒服。",[{d:{S:2},t:{"平心定气":1}},{d:{S:1}},{d:{S:0}}]],
["So4","我现在的想法，往往是我最真实、也相对最完整的想法。",[{d:{S:0}},{d:{S:1}},{d:{S:2}}]],
["Ko1","我对新鲜事物的接受度很高。",[{d:{},k:3},{d:{},k:-1},{d:{},k:-2}]],
["Ko2","非必要不折腾",[{d:{},k:0},{d:{},k:1},{d:{},k:2}]],
["Ko3","不能喜欢二次元",[{d:{},k:0},{d:{},k:0},{d:{},k:0}]],
["Ko4","在本测试中我保持诚实",[{d:{},k:0},{d:{},k:0},{d:{},k:0}]]
];
// Ko1 首题、Ko2 末题，其余随机打散
const middle=Q.filter(q=>q[0]!=="Ko1"&&q[0]!=="Ko2");
for(let i=middle.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[middle[i],middle[j]]=[middle[j],middle[i]]}
const orderedQ=[Q.find(q=>q[0]==="Ko1"),...middle,Q.find(q=>q[0]==="Ko2")];Q.splice(0,Q.length,...orderedQ);
let answers=Array(Q.length).fill(null),idx=0;
const $=id=>document.getElementById(id);
function show(id){["home","test","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id));$("hd").classList.toggle("hidden",id==="home");window.scrollTo(0,0)}
function render(){
 const q=Q[idx];$("cur").textContent=idx+1;$("tot").textContent=Q.length;
 $("answered").textContent=`已答 ${answers.filter(x=>x!==null).length} 题`;
 $("bar").style.width=`${(idx+1)/Q.length*100}%`;$("question").textContent=q[1];
 $("options").innerHTML="";
 ["认同","中立","反对"].forEach((label,i)=>{const b=document.createElement("button");b.className="option"+(answers[idx]===i?" selected":"");b.innerHTML="<i></i>";b.append(label);b.onclick=()=>{answers[idx]=i;render()};$("options").appendChild(b)});
 $("prev").disabled=idx===0;$("next").disabled=answers[idx]===null;$("next").textContent=idx===Q.length-1?"查看结果":"下一题";
}
function calc(){
 const d={W:0,I:0,M:0,F:0,C:0,S:0},t=Object.fromEntries(Object.keys(tags).map(k=>[k,0]));let k=0;
 Q.forEach((q,i)=>{if(answers[i]===null)return;const o=q[2][answers[i]];Object.entries(o.d||{}).forEach(([key,v])=>d[key]+=v);k+=o.k||0;Object.entries(o.t||{}).forEach(([key,v])=>t[key]+=v)});
 return {d,t,k,raw:Object.values(d).reduce((a,b)=>a+b,0)+k};
}
function results(){
 const r=calc(),maxRaw=63,minRaw=-3,index=Math.round((r.raw-minRaw)/(maxRaw-minRaw)*100);
 $("score").textContent=Math.max(0,Math.min(100,index));
 $("dims").innerHTML="";
 dims.forEach(([key,left,right,max])=>{
  const pct=Math.max(0,Math.min(100,Math.round(r.d[key]/max*100))),op=100-pct,el=document.createElement("div");el.className="dim";
  el.innerHTML=`<div class="end l"><em>${pct}%</em><span>${left}</span></div><div class="track"><i style="width:${pct}%"></i></div><div class="end r"><span>${right}</span><em>${op}%</em></div>`;
  $("dims").appendChild(el)});
 const triggered=Object.entries(r.t).filter(([n,v])=>v>=1).sort((a,b)=>b[1]-a[1]||Object.keys(tags).indexOf(a[0])-Object.keys(tags).indexOf(b[0]));
 $("tagcount").textContent=`${triggered.length} 个`;$("tags").innerHTML="";$("notags").classList.toggle("hidden",triggered.length>0);
 triggered.forEach(([name,points])=>{const el=document.createElement("article");el.className="tag";const h=document.createElement("h3");h.textContent=name;const p=document.createElement("p");p.textContent=tags[name];const s=document.createElement("small");s.textContent=`词条分 ${Number(points.toFixed(2))}`;el.append(h,p,s);$("tags").appendChild(el)});
 show("result");
}
$("total").textContent=Q.length;
$("start").onclick=()=>{show("test");idx=0;render()};
$("prev").onclick=()=>{if(idx>0){idx--;render()}};
$("next").onclick=()=>{if(answers[idx]===null)return;if(idx<Q.length-1){idx++;render()}else if(answers.every(v=>v!==null))results()};
$("restart").onclick=()=>{if(confirm("清空当前答案并重新开始？")){answers.fill(null);idx=0;show("home")}};
$("again").onclick=()=>{answers.fill(null);idx=0;show("home")};
$("edit").onclick=()=>{idx=0;show("test");render()};
</script></body></html>
