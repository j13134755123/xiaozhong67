<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小众测试</title><meta name="color-scheme" content="dark">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--or:#ff9000;--or2:#ffa31a;--bg:#000;--p1:#0e0e0e;--p2:#161616;--ln:#262626;--tx:#f4f1ec;--mu:#8c8780;--cream:#ece4d6;--e:cubic-bezier(.22,.8,.24,1);color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 "PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:880px;margin:0 auto;padding:22px 16px 40px}
.logo{display:inline-flex;align-items:center;gap:2px;font-weight:900;letter-spacing:-.03em;line-height:1;color:#fff;font-size:30px}
.logo b{background:var(--or);color:#000;border-radius:.2em;padding:.12em .24em .16em;font-weight:900}
.logo.xl{font-size:clamp(54px,13vw,96px);margin:0 0 26px}
header{display:flex;justify-content:space-between;align-items:center;padding:4px 0 26px;border-bottom:1px solid var(--ln);margin-bottom:26px}
header span{color:var(--mu);font-size:13px}
.panel{background:linear-gradient(180deg,#151210,var(--p1) 240px);border:1px solid var(--ln);border-radius:16px;padding:clamp(22px,5vw,44px)}
h1{margin:0 0 6px;font-size:clamp(28px,5vw,40px);font-weight:900;letter-spacing:-.03em;line-height:1.2}
h2{font-size:clamp(22px,4.2vw,30px);line-height:1.45;font-weight:800;margin:0;letter-spacing:-.01em}
p{margin:0 0 14px}
.lead{font-size:clamp(17px,2.6vw,20px);color:var(--cream);max-width:34em}
.mu{color:var(--mu);font-size:14px}
.warn{color:var(--tx);font-size:15px;border-left:2px solid var(--or);padding-left:12px;max-width:42em;margin:22px 0 14px}
.hidden{display:none!important}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:10px;padding:12px 20px;border:1px solid #333;background:transparent;color:var(--tx);touch-action:manipulation;transition:background .16s var(--e),border-color .16s var(--e),color .16s var(--e),transform .12s var(--e)}
button:active:not(:disabled){transform:scale(.985)}
@media(hover:hover){button:hover:not(:disabled){border-color:var(--or)}}
button:focus-visible{outline:2px solid var(--or);outline-offset:3px}
button:disabled{cursor:not-allowed;background:#141414;border-color:#1f1f1f;color:#4a4a4a}
.primary{background:var(--or);border-color:var(--or);color:#000}
@media(hover:hover){.primary:hover:not(:disabled){background:var(--or2);border-color:var(--or2)}}
.primary:disabled{background:#141414;border-color:#1f1f1f;color:#4a4a4a}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:14px}
.top b{color:var(--tx)}
.progress{height:4px;background:#1f1f1f;border-radius:4px;margin:12px 0 34px;overflow:hidden}
.progress span{display:block;width:100%;height:100%;background:var(--or);transform-origin:0 50%;transition:transform .5s var(--e)}
.options{display:grid;gap:10px;margin:30px 0 8px}
.option{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:16px 18px;background:var(--p2);border-color:#2a2a2a;font-weight:600}
.option i{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #4a4a4a;background:transparent;box-shadow:inset 0 0 0 3px transparent;transition:border-color .25s var(--e),background .25s var(--e),box-shadow .25s var(--e),transform .35s var(--e)}
@media(hover:hover){.option:hover:not(.selected){background:#1d1d1d}}
.option.selected{background:var(--or);border-color:var(--or);color:#000}
.option.selected i{border-color:#000;background:#000;box-shadow:inset 0 0 0 3px var(--or);transform:scale(1.06)}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:28px}
.actions div{display:flex;gap:8px}
.score-l{color:var(--mu);font-size:14px;margin-top:14px}
.score{font-size:clamp(84px,20vw,140px);font-weight:900;line-height:1;letter-spacing:-.05em;color:var(--or)}
.verdict{margin:16px 0 0;font-size:clamp(17px,2.8vw,22px);font-weight:700;line-height:1.6;color:var(--cream);border-left:3px solid var(--or);padding-left:14px}
.sec{border-top:1px solid var(--ln);margin-top:34px;padding-top:26px}
.sec h2{margin-bottom:20px}
.dims{display:grid;gap:22px}
.dim{display:grid;grid-template-columns:minmax(0,170px) 1fr minmax(0,170px);gap:16px;align-items:center}
.end{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px;font-weight:800}
.end em{font-style:normal;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.end.l em{color:var(--or)}.end.r em{color:var(--cream)}
.track{height:10px;background:var(--cream);border-radius:12px;overflow:hidden}
.track i{display:block;height:100%;width:var(--w,0%);transform-origin:0 50%;background:var(--or);border-radius:12px 0 0 12px;animation:grow 1.2s var(--e) calc(var(--d,0ms) + 300ms) backwards}
.tags{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.tag{background:var(--p2);border:1px solid var(--ln);border-left:3px solid var(--or);border-radius:10px;padding:11px 16px 12px}
.tag h3{margin:0 0 2px;font-size:16px;font-weight:900;color:var(--or)}
.tag p{margin:0;font-size:13.5px;color:#cfc8bc;line-height:1.6}
.ver{margin-top:22px;font-size:12px;color:#5a5650}
footer{text-align:center;color:#5a5650;font-size:12px;padding:26px}
@media(max-width:600px){.dims{gap:24px}.dim{grid-template-columns:1fr 1fr;gap:9px 12px}.end.l{justify-content:flex-start}.end.r{justify-content:flex-end}.end{font-size:14px}.dim .track{grid-column:1/-1;grid-row:2}.logo{font-size:26px}}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes fadein{from{opacity:0}}
.pin{animation:fadein .4s var(--e) backwards}
.qin{animation:enter .45s var(--e) backwards}
.oin .option{animation:enter .35s var(--e) calc(var(--i,0)*35ms + 40ms) backwards}
.fade{animation:enter .6s var(--e) 400ms backwards}
.dim{animation:enter .55s var(--e) var(--d,0ms) backwards}
.tag{animation:enter .5s var(--e) var(--d,0ms) backwards}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main>
<header id="hd" class="hidden"><div class="logo">小众<b>测试</b></div></header>

<section id="home" class="panel" style="margin-top:clamp(0px,4vh,32px)">
<div class="logo xl">小众<b>测试</b></div>
<p class="lead">通过六个维度，生成你的小众指数与倾向词条。</p>
<p class="warn">本测试仅适用于中国大陆语境，仅供娱乐。题目带有明显主观性，缺乏严格的心理测量学验证，结果并不严谨，部分题目或词条可能造成冒犯。</p>
<p class="mu">共 <span id="total"></span> 题，每题选一项，可返回修改。</p>
<button id="start" class="primary">开始测试</button>
</section>

<section id="test" class="panel hidden">
<div class="top"><span><b id="cur"></b> / <span id="tot"></span></span><span id="answered"></span></div>
<div class="progress"><span id="bar"></span></div>
<h2 id="question"></h2>
<div id="options" class="options"></div>
<div class="actions"><button id="prev">上一题</button><div><button id="restart">重来</button><button id="next" class="primary" disabled>下一题</button></div></div>
</section>

<section id="result" class="panel hidden">
<h1>测试结果</h1>
<div class="score-l">小众指数</div>
<div class="score" id="score">0</div>
<p class="verdict" id="verdict"></p>
<div class="sec"><h2>六维正反对照</h2><div id="dims" class="dims"></div></div>
<div class="sec"><h2>触发词条 <span id="tagcount" class="mu"></span></h2><div id="tags" class="tags"></div><p id="notags" class="mu hidden">这次没有触发词条。</p></div>
<div class="actions"><button id="edit">检查答案</button><button id="again" class="primary">重新测试</button></div>
<div class="ver">题库版本：3.0</div>
</section>
<footer>本地运行 · 答案不会上传</footer>
</main>
<script>
const dims=[["W","世界观偏离","主流认同"],["I","感知敏锐","感知宽容"],["M","边缘敏感","主流适应"],["F","反常识倾向","循规顺从"],["C","文化离群","文化主流"],["S","自我反身性","盲目投射"]];
const tags={
"内陆帝国":"让无生命之物开口，直觉凌驾理性，真假难辨，因此既危险又深邃",
"宏大叙事":"以总体性框架解释世界、赋予意义的统一故事",
"天人感应":"察觉他人未言之意与城市的集体情绪",
"叙事怀疑":"利奥塔称后现代即对宏大叙事的怀疑",
"审美自主":"审美源于主体的自由自律，判断不受欲望与概念强制",
"体验至上":"将直接感受视为价值核心的立场，认为意义源于亲身经历的当下体验",
"斗笠":"请调整斗笠","自由主义":"向往，渴望，渴求，痴迷","怀旧":"回不去了，你有班有学要上",
"人间失格":"生きるってのはな、痛いんだよ","虚无主义":"一切归于混沌",
"概念化":"强大的艺术鉴赏与联想力，善于解读与将现实事物抽象化",
"平心定气":"过人的意志力与心理韧性","亚文化":"行"};
const NJ={"内陆帝国":.5,"天人感应":.25};
const Q=[
["Wo1","没有取得传统意义上的成功，也可能拥有很好的人生。",[{d:{W:1},k:1,t:{"自由主义":.5}},{d:{W:0}},{d:{W:-1},t:{"宏大叙事":.5}}]],
["Wo2","关系的价值看的是它带来了什么，而不是持续了多久。",[{d:{W:1,S:1},t:{"体验至上":1}},{d:{W:1}},{d:{W:-1}}]],
["Wo3","一种社会规则为了大多数人过得更好，不可避免地限制了少数人的选择，这么做问题不大。",[{d:{W:-1},t:{"宏大叙事":.5}},{d:{W:0}},{d:{W:2},t:{"自由主义":.5}}]],
["Wo4","祖宗之法，不可变。",[{d:{W:0},t:{"宏大叙事":1,"斗笠":1}},{d:{W:0}},{d:{W:2}}]],
["Wo5","一个人自愿成为了自己曾经最不理解的那种人，在你看来这种变化往往是难以接受的。",[{d:{W:0}},{d:{W:1}},{d:{W:1,S:1}}]],
["Wo6","如果一个人明知道某种选择不会带来更多东西，却仍然长期坚持，这往往说明这个选择的价值有限，值得重新考虑。",[{d:{W:1},t:{"虚无主义":.5}},{d:{W:1}},{d:{W:2},t:{"体验至上":1}}]],
["Io1","我不会在说不清理由时给一个人下判断。",[{d:{I:1}},{d:{I:1}},{d:{I:2},t:{...NJ}}]],
["Io2","我有时能先察觉一件事哪里不对劲，之后才逐渐找到具体原因。",[{d:{I:2},t:{...NJ}},{d:{I:1}},{d:{I:-1}}]],
["Io3","在欣赏作品（如电影、艺术、设计）时，你更容易被具有象征意味的氛围和隐喻打动。",[{d:{I:2},t:{...NJ,"概念化":1}},{d:{I:1}},{d:{I:0}}]],
["Io4","贴标签很爽对吧？",[{d:{I:2},t:{...NJ}},{d:{I:1},t:{...NJ}},{d:{I:1}}]],
["Mo1","涉及恐惧、死亡或道德禁忌的作品吸引着你。",[{d:{M:0}},{d:{M:1}},{d:{M:3}}]],
["Mo2","一部电影会出于安全考量避免使用脏话，你仍可能会看，毕竟与质量无关。",[{d:{M:-1,W:-1}},{d:{M:0}},{d:{M:2,W:2}}]],
["Fo1","如果某种行为在大多数情况下都能奏效，那么人们把它当成普遍经验并没有什么问题。",[{d:{F:0}},{d:{F:1}},{d:{F:1,W:1},t:{"叙事怀疑":.5}}]],
["Fo2","当事物的解释越顺滑，越可能是“好用的故事”。",[{d:{F:2},t:{"叙事怀疑":.5,"虚无主义":.5}},{d:{F:1}},{d:{F:0}}]],
["Fo3","人们对一件事的判断，往往受到它最初被介绍的方式影响。",[{d:{F:2},t:{"叙事怀疑":.5}},{d:{F:1}},{d:{F:0}}]],
["Fo4","事情本就如此，恰恰是最诚实的解释。",[{d:{F:0}},{d:{F:1}},{d:{F:2},t:{"叙事怀疑":.5}}]],
["Fo5","复杂和新颖的想法比简单直接的想法更能激发你的兴趣。",[{d:{F:2}},{d:{F:1}},{d:{F:0}}]],
["Fo6","即使一部作品受到差评如潮，我也倾向不把批评者的共识当作判断依据。",[{d:{F:2}},{d:{F:1}},{d:{F:0}}]],
["Co1","我喜欢一样东西时，通常不太在意它是否被很多人喜欢。",[{d:{C:-1},t:{"审美自主":.5}},{d:{C:1}},{d:{C:2}}]],
["Co2","自己喜欢的东西很难用身边人的共同话题解释。",[{d:{C:2,M:2},t:{"亚文化":.5}},{d:{C:1,M:1}},{d:{C:0}}]],
["Co3","小众的众还有三个人，而我却孤身一人。",[{d:{C:1,M:1},t:{"人间失格":1,"亚文化":.5}},{d:{C:1,M:1}},{d:{C:-1}}]],
["Co4","过时的事物将失去价值。",[{d:{C:0}},{d:{C:1}},{d:{C:2},t:{"怀旧":1}}]],
["Co5","一件东西有没有形成稳定的受众群体，对我判断它是否值得喜欢影响不大。",[{d:{C:2},t:{"审美自主":1}},{d:{C:1},t:{"审美自主":.5}},{d:{C:0},t:{"亚文化":.5}}]],
["Co6","当我发现自己喜欢的作品被大量商业账号推广时，即使作品本身没有变化，我对它的兴趣也可能减弱。",[{d:{C:3}},{d:{C:1}},{d:{C:-1}}]],
["So1","我曾经认真怀疑过一些自己一直以来都认为理所当然的想法。",[{d:{S:2},t:{"叙事怀疑":1}},{d:{S:1}},{d:{S:0}}]],
["So2","我会区分“我真正这么想”和“我希望自己是这样想的”。",[{d:{S:1},t:{"平心定气":1}},{d:{S:1}},{d:{S:0}}]],
["So3","我现在的想法，往往是我最真实、也相对最完整的想法。",[{d:{S:-1}},{d:{S:0}},{d:{S:2}}]],
["Ko1","我对新鲜事物的接受度非常高。",[{d:{},k:3},{d:{},k:-2},{d:{},k:-3}]],
["Ko2","我不倾向于折腾某个陌生领域的事物。",[{d:{},k:-1},{d:{},k:1},{d:{},k:2}]],
["Ko3","不能喜欢二次元。",[{d:{},k:0},{d:{},k:0},{d:{},k:0}]],
["Ko4","在本测试中我保持诚实。",[{d:{},k:0},{d:{},k:0},{d:{},k:0}]],
["Ko5","我们的文化事业虽充满挑战，但总体上，大有可为。",[{d:{},k:0},{d:{},k:0},{d:{},k:0}]],
["Ko6","一部作品如果需要了解大量背景知识才能欣赏，那么这种知识门槛本身就足以说明它比一般作品更有价值。",[{d:{},k:0},{d:{},k:1},{d:{},k:2}]],
["Ko7","太躁的歌不听。",[{d:{},k:0},{d:{},k:0},{d:{},k:-2}]]
];
// Ko1 首题、Ko4 末题，其余随机打散
const middle=Q.filter(q=>q[0]!=="Ko1"&&q[0]!=="Ko4");
for(let i=middle.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[middle[i],middle[j]]=[middle[j],middle[i]]}
const orderedQ=[Q.find(q=>q[0]==="Ko1"),...middle,Q.find(q=>q[0]==="Ko4")];Q.splice(0,Q.length,...orderedQ);
let answers=Array(Q.length).fill(null),idx=0;
const $=id=>document.getElementById(id);
function replay(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
const reduceMotion=()=>typeof matchMedia==="function"&&matchMedia("(prefers-reduced-motion: reduce)").matches;
// 数字滚动：从起跳分升到结果；兜底定时器保证最终一定显示正确数值
function countUp(el,to,ms){
 el.textContent=to;
 if(reduceMotion()||typeof requestAnimationFrame!=="function"||typeof performance==="undefined")return;
 const from=IDX_LO,t0=performance.now();let done=false;
 const fin=()=>{done=true;el.textContent=to};
 const step=t=>{if(done)return;const p=Math.min(1,(t-t0)/ms);if(p>=1){fin();return}el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,4)));requestAnimationFrame(step)};
 el.textContent=from;requestAnimationFrame(step);setTimeout(fin,ms+500);
}
function show(id){["home","test","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id));$("hd").classList.toggle("hidden",id==="home");window.scrollTo(0,0);replay($(id),"pin")}
let shown=-1;
// 选择时只同步选中态，不重建选项（保证过渡动画连贯）
function paint(){
 const bs=$("options").children;
 for(let i=0;i<bs.length;i++)bs[i].classList.toggle("selected",answers[idx]===i);
 $("answered").textContent=`已答 ${answers.filter(x=>x!==null).length} 题`;$("next").disabled=answers[idx]===null;
}
function render(){
 const q=Q[idx],changed=shown!==idx;shown=idx;$("cur").textContent=idx+1;$("tot").textContent=Q.length;
 $("bar").style.transform=`scaleX(${(idx+1)/Q.length})`;$("question").textContent=q[1];
 $("options").innerHTML="";
 ["认同","中立","反对"].forEach((label,i)=>{const b=document.createElement("button");b.className="option"+(answers[idx]===i?" selected":"");b.style.setProperty("--i",i);b.innerHTML="<i></i>";b.append(label);b.onclick=()=>{answers[idx]=i;paint()};$("options").appendChild(b)});
 $("prev").disabled=idx===0;$("next").textContent=idx===Q.length-1?"查看结果":"下一题";
 paint();
 if(changed){replay($("question"),"qin");replay($("options"),"oin")}
}
// 中立不得拿到极端分：每题每个维度上，中立值先夹在两端表态（认同/反对）之间，且最高只取该题分值跨度的 NEU_CAP
// （只有明确表态才能拿满分；原题库里与满分并列的中立，按 NEU_CAP 折算）
const NEU_CAP=0.75;
function eff3(v){const lo=Math.min(v[0],v[2]),hi=Math.max(v[0],v[2]);return [v[0],Math.min(Math.max(v[1],lo),lo+NEU_CAP*(hi-lo)),v[2]]}
const optVals=(q,key)=>eff3(q[2].map(o=>((key==="k"?o.k:(o.d&&o.d[key]))||0)));
// 原始累计：仅累加已作答题目的维度分、K 分与词条分（K 不参与指数）
function calc(ans=answers,qs=Q){
 const d=Object.fromEntries(dims.map(([key])=>[key,0])),t=Object.fromEntries(Object.keys(tags).map(k=>[k,0]));let k=0;
 qs.forEach((q,i)=>{if(ans[i]===null||ans[i]===undefined)return;const o=q[2][ans[i]];dims.forEach(([key])=>{if(q[2].some(x=>x.d&&key in x.d))d[key]+=optVals(q,key)[ans[i]]});if(q[2].some(x=>x.k!==undefined))k+=optVals(q,"k")[ans[i]];Object.entries(o.t||{}).forEach(([key,v])=>t[key]+=v)});
 return {d,t,k};
}
// 各维度理论下/上限：由题目配置自动推导；该题任一选项都未涉及的维度不参与，涉及时未写分值的选项按 0 计
function dimBounds(qs=Q){
 const b=Object.fromEntries(dims.map(([key])=>[key,{min:0,max:0}]));
 qs.forEach(q=>dims.forEach(([key])=>{
  if(!q[2].some(o=>o.d&&key in o.d))return;
  const v=optVals(q,key);
  b[key].min+=Math.min(...v);b[key].max+=Math.max(...v)}));
 return b;
}
// 取值范围：指数 35–100；各维度显示百分比 10%–90%（标准化得分 0–100 线性映射）
const IDX_LO=35,IDX_EXP=1.46,DIM_LO=10,DIM_HI=90,K_W=1;
const dimPct=n=>Math.round(DIM_LO+n*(DIM_HI-DIM_LO)/100);
// 标准化到 0–100（上下限相同时取中性值 50，避免除以零）
function normDim(v,{min,max}){return max===min?50:Math.max(0,Math.min(100,(v-min)/(max-min)*100))}
// K 理论下/上限：涉及 K 分的题逐题取极值（未写 k 的选项按 0 计）
function kBounds(qs=Q){
 let min=0,max=0;
 qs.forEach(q=>{if(!q[2].some(o=>o.k!==undefined))return;const v=optVals(q,"k");min+=Math.min(...v);max+=Math.max(...v)});
 return {min,max};
}
// 最终计分：必须全部作答，否则返回 null；
// 六维只取六维标准化得分；指数 = (六维标准化得分之和 + K 标准化得分×K_W) ÷ (6 + K_W) 后再映射到 35–100（K 不显示、不计入六维）
function scoreResult(ans=answers,qs=Q){
 if(ans.length!==qs.length||ans.some(v=>v===null||v===undefined))return null;
 const r=calc(ans,qs),b=dimBounds(qs),n={};
 dims.forEach(([key])=>{n[key]=normDim(r.d[key],b[key])});
 const kb=kBounds(qs),useK=kb.max>kb.min,nK=normDim(r.k,kb);
 const mean=(dims.reduce((s,[key])=>s+n[key],0)+(useK?nK*K_W:0))/(dims.length+(useK?K_W:0));
 const index=Math.max(IDX_LO,Math.min(100,Math.round(IDX_LO+(100-IDX_LO)*Math.pow(mean/100,IDX_EXP))));
 return {...r,n,nK,index};
}
function results(){
 const r=scoreResult();if(!r)return;
 countUp($("score"),r.index,1100);replay($("verdict"),"fade");
 $("verdict").textContent=r.index<50?"大家都这么过，你也没觉得有什么问题。":r.index<60?"挺好的，没必要非得证明什么。":r.index<76?"再往下就是不能涉足的地方了":r.index<96?"你的生活一定不像这场测试一样无聊。":"你赢了";
 $("dims").innerHTML="";
 dims.forEach(([key,left,right],di)=>{
  const pct=dimPct(r.n[key]),op=100-pct,el=document.createElement("div");el.className="dim";el.style.setProperty("--d",di*70+"ms");
  el.innerHTML=`<div class="end l"><em>${pct}%</em><span>${left}</span></div><div class="track"><i style="--w:${pct}%"></i></div><div class="end r"><span>${right}</span><em>${op}%</em></div>`;
  $("dims").appendChild(el)});
 const triggered=Object.entries(r.t).filter(([n,v])=>v>=1).sort((a,b)=>b[1]-a[1]||Object.keys(tags).indexOf(a[0])-Object.keys(tags).indexOf(b[0]));
 $("tagcount").textContent=`${triggered.length} 个`;$("tags").innerHTML="";$("notags").classList.toggle("hidden",triggered.length>0);
 triggered.forEach(([name,points],ti)=>{const el=document.createElement("article");el.className="tag";el.style.setProperty("--d",700+ti*60+"ms");const h=document.createElement("h3");h.textContent=name;const p=document.createElement("p");p.textContent=tags[name];el.append(h,p);$("tags").appendChild(el)});
 show("result");
}
$("total").textContent=Q.length;
$("start").onclick=()=>{show("test");idx=0;render()};
$("prev").onclick=()=>{if(idx>0){idx--;render()}};
$("next").onclick=()=>{if(answers[idx]===null)return;if(idx<Q.length-1){idx++;render()}else if(answers.every(v=>v!==null))results()};
$("restart").onclick=()=>{if(confirm("清空当前答案并重新开始？")){answers.fill(null);idx=0;show("home")}};
$("again").onclick=()=>{answers.fill(null);idx=0;show("home")};
$("edit").onclick=()=>{idx=0;show("test");render()};
</script></body></html>
